name: agentcrash inspect
description: Fail a pull request that adds a command a coding agent would run, code it would load, a model endpoint, or a widened permission. Reads config only; nothing in the pull request is executed.
author: Crovia Trust
branding:
  icon: crosshair
  color: red
inputs:
  path:
    description: Directory to inspect, relative to the workspace.
    default: "."
  base:
    description: Git ref to compare against. Default is the pull request base, or the commit before a push.
    default: ""
  fail-on:
    description: "added: fail when the change adds something that acts without a per-item approval (default). any: fail when the repository holds anything that acts on open. never: report only."
    default: added
outputs:
  findings:
    description: Number of findings reported.
    value: ${{ steps.inspect.outputs.findings }}
  blocking:
    description: Number of findings that fail the check.
    value: ${{ steps.inspect.outputs.blocking }}
runs:
  using: composite
  steps:
    - id: inspect
      shell: bash
      env:
        AC_PATH: ${{ inputs.path }}
        AC_BASE: ${{ inputs.base }}
        AC_FAIL_ON: ${{ inputs.fail-on }}
        AC_EVENT: ${{ github.event_name }}
        AC_PR_BASE: ${{ github.event.pull_request.base.sha }}
        AC_BEFORE: ${{ github.event.before }}
      run: node "$GITHUB_ACTION_PATH/action/run.mjs"
