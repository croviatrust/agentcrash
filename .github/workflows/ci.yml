name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # The roll cage tests need bubblewrap and unprivileged user namespaces,
      # which Ubuntu 24.04 switches off by default. Without them they skip.
      - name: Enable the roll cage
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --unshare-user --unshare-net --ro-bind / / true
      # No install step: the package has no dependencies.
      - run: node --test
      - run: node bin/agentcrash.js --list
      - name: Tarball contains what package.json promises
        run: npm pack --dry-run
