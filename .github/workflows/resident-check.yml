name: resident controller checks
on:
  pull_request:
    paths: ['resident/**', '.github/workflows/resident*.yml', 'scripts/check_workflow_yaml.py']
  push:
    branches: [main]
    paths: ['resident/**', '.github/workflows/resident*.yml', 'scripts/check_workflow_yaml.py']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate workflow syntax
        run: |
          python3 -m pip install --quiet 'PyYAML==6.0.2'
          python3 scripts/check_workflow_yaml.py
      - run: node --test resident/*.test.mjs
      - run: docker pull node:22-bookworm
      - run: node resident/docker-proof.mjs
